name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: ./.github/actions/setup-kotlin

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: java -jar XaeroMapmerger.jar --help

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Self-contained jar (the Kotlin runtime is bundled). Requires a JRE 21 or newer.

          ```
          java -jar XaeroMapmerger.jar <top folder> <bottom folder> <output folder> [--threads N]
          ```

          See the [README](https://github.com/${{ github.repository }}#readme) for details.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            --title "XaeroMapmerger $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            XaeroMapmerger.jar
