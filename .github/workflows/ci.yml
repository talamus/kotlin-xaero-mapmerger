name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: ./.github/actions/setup-kotlin

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: |
          java -jar XaeroMapmerger.jar --help
          if java -jar XaeroMapmerger.jar > /dev/null 2>&1; then
            echo "expected a non-zero exit when run without arguments" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: XaeroMapmerger-jar
          path: XaeroMapmerger.jar
          if-no-files-found: error
